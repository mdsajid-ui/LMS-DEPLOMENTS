<!DOCTYPE html>
<html>

    <title>DV Analytics • Learning Management System</title>
    <script type="text/javascript">

      var path = window.location.pathname;
      var repo = '/LMS-DEPLOMENTS';
      var cleanPath = path.startsWith(repo) ? path.substring(repo.length) : path;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      if (cleanPath.toLowerCase().indexOf('/admin') !== -1) {
        window.location.replace(repo + '/#' + cleanPath + search + hash);
      } else {
        window.location.replace(repo + '/#' + cleanPath + search + hash);
      }
    </script>
